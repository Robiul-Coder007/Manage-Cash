{% extends 'base.html' %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h3 class="card-title text-center mb-4"><i class="fas fa-user-plus me-2"></i>Register</h3>
        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-25 d-block mx-auto mt-3">Register</button>
        </form>
        <div class="text-center mt-3">
            <p>Already have an account? <a href="{% url 'user_login' %}">Login here</a></p>
        </div>
    </div>
</div>
{% endblock %}
