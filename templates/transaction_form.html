{% extends 'base.html' %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h3 class="card-title text-center mb-4">{% if "Expense" in title %}
            <i class="fas fa-minus-circle me-2"></i>{% else %}
            <i class="fas fa-plus-circle me-2"></i>{% endif %}
            {{ title }}
        </h3>
        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-25 d-block mx-auto mt-3">Save Transaction</button>
        </form>
    </div>
</div>
{% endblock %}
