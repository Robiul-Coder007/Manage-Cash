{% extends 'base.html' %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h3 class="card-title text-center mb-4">
            <i class="fas fa-key me-2 text-primary"></i>Change Password
        </h3>
        <p class="text-center text-muted small mb-4">Username: <strong>{{ request.user.username }}</strong></p>
        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-25 d-block mx-auto mt-3">Change Password</button>
        </form>
        <div class="text-center mt-3">
            <p><a href="{% url 'dashboard' %}" class="text-secondary text-decoration-none">
                    <i class="fas fa-arrow-left me-1"></i>Back to Dashboard</a></p>
        </div>
    </div>
</div>
{% endblock %}
