{% extends 'base.html' %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h3 class="card-title text-center mb-4"><i class="fas fa-sign-in-alt me-2"></i>Login</h3>
        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-25 d-block mx-auto mt-3">Login</button>
        </form>
        <div class="text-center mt-3">
            <p>Don't have an account? <a href="{% url 'user_register' %}">Register here</a></p>
        </div>
    </div>
</div>
{% endblock %}
